name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - name: Build
        shell: bash
        run: |
          set +e
          npm run build >build.log 2>&1
          build_status=$?
          if [ "$build_status" -ne 0 ]; then
            if grep -Eqi '@rollup/rollup-|rollup.*native' build.log; then
              echo '::error title=Production build failed::Category: Rollup native package'
            elif grep -Eqi '@rolldown/binding-|rolldown.*binding' build.log; then
              echo '::error title=Production build failed::Category: Rolldown native package'
            elif grep -Eqi '@tailwindcss/oxide-|lightningcss-' build.log; then
              echo '::error title=Production build failed::Category: Tailwind or Lightning CSS native package'
            elif grep -Eqi '@oxc-parser/binding-' build.log; then
              echo '::error title=Production build failed::Category: OXC native package'
            elif grep -Eqi 'workerd|@cloudflare/workerd-' build.log; then
              echo '::error title=Production build failed::Category: Cloudflare Workerd package'
            elif grep -Eqi 'nitro' build.log; then
              echo '::error title=Production build failed::Category: Nitro package'
            elif grep -Eqi 'Cannot find module|Cannot find package|MODULE_NOT_FOUND' build.log; then
              echo '::error title=Production build failed::Category: project or other package import'
            elif grep -Eqi 'ENOENT|no such file or directory' build.log; then
              echo '::error title=Production build failed::Category: missing file'
            elif grep -Eqi 'prerender' build.log; then
              echo '::error title=Production build failed::Category: prerender failure'
            elif grep -Eqi 'environment variable|SUPABASE|VITE_' build.log; then
              echo '::error title=Production build failed::Category: environment configuration'
            elif grep -Eqi 'heap|out of memory|Killed' build.log; then
              echo '::error title=Production build failed::Category: runner memory limit'
            elif grep -Eqi 'RollupError|Build failed with' build.log; then
              echo '::error title=Production build failed::Category: bundler error'
            else
              echo '::error title=Production build failed::Category: uncategorized build error'
            fi
            exit "$build_status"
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: shturoburkotiya
          channelId: live
