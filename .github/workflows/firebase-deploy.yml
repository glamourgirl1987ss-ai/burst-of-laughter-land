name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci
      - name: Build
        shell: bash
        run: |
          set +e
          npm run build >build.log 2>&1
          build_status=$?
          if [ "$build_status" -ne 0 ]; then
            if grep -Eqi '@rollup/rollup-|rollup.*native' build.log; then
              echo '::error title=Production build failed::Category: Rollup native package'
            elif grep -Eqi '@rolldown/binding-|rolldown.*binding' build.log; then
              echo '::error title=Production build failed::Category: Rolldown native package'
            elif grep -Eqi '@tailwindcss/oxide-|lightningcss-' build.log; then
              echo '::error title=Production build failed::Category: Tailwind or Lightning CSS native package'
            elif grep -Eqi '@oxc-parser/binding-' build.log; then
              echo '::error title=Production build failed::Category: OXC native package'
            elif grep -Eqi 'workerd|@cloudflare/workerd-' build.log; then
              echo '::error title=Production build failed::Category: Cloudflare Workerd package'
            elif grep -Eqi '(Cannot find module|Cannot find package)[[:space:]]+[^A-Za-z0-9@]*@tanstack/react-start' build.log; then
              echo '::error title=Production build failed::Category: TanStack React Start import'
            elif grep -Eqi '(Cannot find module|Cannot find package)[[:space:]]+[^A-Za-z0-9@]*@tanstack/(start-server-core|react-start-server)' build.log; then
              echo '::error title=Production build failed::Category: TanStack server-core import'
            elif grep -Eqi '(Cannot find module|Cannot find package)[[:space:]]+[^A-Za-z0-9@]*@tanstack/(react-router|router-core)' build.log; then
              echo '::error title=Production build failed::Category: TanStack router runtime import'
            elif grep -Eqi '(Cannot find module|Cannot find package)[[:space:]]+[^A-Za-z0-9@]*@tanstack/(router-plugin|router-generator)' build.log; then
              echo '::error title=Production build failed::Category: TanStack router build import'
            elif grep -Eqi '(Cannot find module|Cannot find package)[[:space:]]+[^A-Za-z0-9@]*@tanstack/devtools' build.log; then
              echo '::error title=Production build failed::Category: TanStack devtools import'
            elif grep -Eqi '(Cannot find module|Cannot find package)[[:space:]]+[^A-Za-z0-9@]*@tanstack/(react-query|query-core)' build.log; then
              echo '::error title=Production build failed::Category: TanStack query import'
            elif grep -Eqi '(Cannot find module|Cannot find package)[[:space:]]+[^A-Za-z0-9@]*@tanstack/start-plugin-core' build.log; then
              echo '::error title=Production build failed::Category: TanStack Start plugin-core import'
            elif grep -Eqi '(Cannot find module|Cannot find package)[[:space:]]+[^A-Za-z0-9@]*@tanstack/start-fn-stubs' build.log; then
              echo '::error title=Production build failed::Category: TanStack Start function stubs import'
            elif grep -Eqi '(Cannot find module|Cannot find package)[[:space:]]+[^A-Za-z0-9@]*@tanstack/(start-client-core|react-start-client|start-storage-context)' build.log; then
              echo '::error title=Production build failed::Category: TanStack Start client or storage import'
            elif grep -Eqi '(Cannot find module|Cannot find package)[[:space:]]+[^A-Za-z0-9@]*@tanstack/(history|store|react-store|router-utils|virtual-file-routes)' build.log; then
              echo '::error title=Production build failed::Category: TanStack utility import'
            elif grep -Eqi '(Cannot find module|Cannot find package|MODULE_NOT_FOUND).*(@tanstack|tanstack)' build.log; then
              echo '::error title=Production build failed::Category: other TanStack package import'
            elif grep -Eqi '(Cannot find module|Cannot find package|MODULE_NOT_FOUND).*(@lovable|lovable)' build.log; then
              echo '::error title=Production build failed::Category: Lovable package import'
            elif grep -Eqi '(Cannot find module|Cannot find package|MODULE_NOT_FOUND).*(nitro|unenv|h3|rolldown)' build.log; then
              echo '::error title=Production build failed::Category: Nitro dependency import'
            elif grep -Eqi '(Cannot find module|Cannot find package|MODULE_NOT_FOUND).*(vite|rollup|esbuild)' build.log; then
              echo '::error title=Production build failed::Category: Vite dependency import'
            elif grep -Eqi '(Cannot find module|Cannot find package|MODULE_NOT_FOUND).*(react|supabase|sonner|zod)' build.log; then
              echo '::error title=Production build failed::Category: application dependency import'
            elif grep -Eqi 'Could not resolve.*(src/|@/|\./|\.\./)' build.log; then
              echo '::error title=Production build failed::Category: local source import'
            elif grep -Eqi 'Cannot find module|Cannot find package|MODULE_NOT_FOUND' build.log; then
              echo '::error title=Production build failed::Category: project or other package import'
            elif grep -Eqi 'ENOENT|no such file or directory' build.log; then
              echo '::error title=Production build failed::Category: missing file'
            elif grep -Eqi 'prerender' build.log; then
              echo '::error title=Production build failed::Category: prerender failure'
            elif grep -Eqi 'environment variable|SUPABASE|VITE_' build.log; then
              echo '::error title=Production build failed::Category: environment configuration'
            elif grep -Eqi 'heap|out of memory|Killed' build.log; then
              echo '::error title=Production build failed::Category: runner memory limit'
            elif grep -Eqi 'RollupError|Build failed with' build.log; then
              echo '::error title=Production build failed::Category: bundler error'
            elif grep -Eqi 'TypeError|ReferenceError|SyntaxError' build.log; then
              echo '::error title=Production build failed::Category: JavaScript runtime error'
            elif grep -Eqi 'nitro.*error|error.*nitro|\[nitro\].*(error|failed)' build.log; then
              echo '::error title=Production build failed::Category: Nitro build error'
            else
              echo '::error title=Production build failed::Category: uncategorized build error'
            fi
            exit "$build_status"
          fi

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: shturoburkotiya
          channelId: live
